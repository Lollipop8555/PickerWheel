<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FBFAF7" />
  <meta name="description" content="简约优雅的在线大转盘：自定义内容、自动分份、柔和配色，纯静态可离线运行。" />
  <title>Picker Wheel · 大转盘</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="application-name" content="大转盘" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="大转盘" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- 图标：支持 SVG 的现代浏览器优先用矢量图标 -->
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png" />
  <link rel="shortcut icon" href="./favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />

  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <span class="offline-badge" id="offlineBadge" hidden>
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 13l4 4L19 7" />
        </svg>
        可离线使用
      </span>
      <button id="settingsBtn" class="icon-btn" type="button" aria-label="打开设置" aria-expanded="false" aria-controls="panel">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
          <path d="M4 7.5h9M17.5 7.5H20M4 16.5h4.5M13 16.5h7" />
          <circle cx="15.2" cy="7.5" r="2.3" />
          <circle cx="10.8" cy="16.5" r="2.3" />
        </svg>
      </button>
    </header>

    <main class="stage">
      <div class="wheel-wrap" id="wheelWrap">
        <canvas id="wheel" width="600" height="600" role="img" aria-label="抽选转盘"></canvas>
        <div class="hub" id="hub" aria-live="polite">
          <span class="hub-caption" id="hubCaption">选项数</span>
          <span class="hub-value" id="hubValue">6</span>
        </div>
        <div class="pointer" aria-hidden="true"></div>
      </div>
    </main>

    <footer class="bottombar">
      <button id="spinBtn" class="primary-btn" type="button">开始</button>
    </footer>
  </div>

  <div class="scrim" id="scrim"></div>

  <aside class="panel" id="panel" aria-labelledby="panelTitle" aria-hidden="true" tabindex="-1">
    <div class="panel-head">
      <h2 id="panelTitle">设置转盘</h2>
      <button id="closeBtn" class="icon-btn is-ghost" type="button" aria-label="关闭设置">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </div>

    <div class="panel-body">
      <section class="field">
        <label for="lines">
          选项内容
          <span class="hint">每行一条，连续相同的行会合并显示</span>
        </label>
        <textarea id="lines" spellcheck="false" autocomplete="off" placeholder="A&#10;B&#10;C&#10;D"></textarea>
      </section>

      <section class="field">
        <label for="duration">
          转动时间
          <span class="hint">单位秒，最少 5 秒</span>
        </label>
        <div class="number-field">
          <input id="duration" type="number" min="5" max="600" step="1" value="5" inputmode="numeric" />
          <span class="unit">秒</span>
        </div>
      </section>

      <section class="field">
        <span class="label">快捷方案</span>
        <div class="presets" id="presets"></div>
      </section>

      <section class="field">
        <label for="shareUrl">
          分享链接
          <span class="hint">发给别人，打开就是同一个转盘</span>
        </label>
        <div class="share-field">
          <input
            id="shareUrl"
            type="text"
            readonly
            spellcheck="false"
            autocomplete="off"
            placeholder="输入内容后自动生成"
          />
          <button id="copyBtn" class="ghost-btn" type="button" disabled>复制</button>
        </div>
      </section>
    </div>

    <div class="panel-foot">
      <p class="panel-hint" id="panelHint" role="status"></p>
      <button id="applyBtn" class="primary-btn is-block" type="button">生成转盘</button>
    </div>
  </aside>

  <noscript>
    <p class="noscript">这个转盘需要启用 JavaScript 才能运行。</p>
  </noscript>

  <script src="./app.js"></script>
</body>
</html>
